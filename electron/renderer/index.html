<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>voiStarcraft2 Commander</title><link rel="stylesheet" href="./style.css"></head><body><main><header><p class="eyebrow">voiStarcraft2 / DIRECT COMMAND</p><h1>전술 명령창</h1><span id="status">연결 확인 중…</span></header><section class="panel"><form id="command-form"><label for="command">명령</label><div class="row"><input id="command" autocomplete="off" placeholder="예: 앞마당을 방어해"><button>전송</button></div></form><p id="feedback" role="status"></p></section><section class="panel"><h2>최근 응답</h2><pre id="result">아직 명령이 없습니다.</pre></section><section class="panel"><h2>Clarification / lifecycle</h2><p id="lifecycle">이벤트를 기다리는 중…</p><pre id="events">아직 이벤트가 없습니다.</pre></section><section class="panel"><h2>Semantic target pin</h2><form id="pin-form"><div class="row"><input id="pin-name" required maxlength="128" placeholder="이름 (예: 앞마당 입구)"><select id="pin-target" required aria-label="semantic target"><option value="enemy_natural">enemy_natural · 적 앞마당</option><option value="enemy_main">enemy_main · 적 본진</option><option value="enemy_front">enemy_front · 적 전방</option><option value="enemy_ramp">enemy_ramp · 적 입구</option><option value="self_ramp">self_ramp · 우리 입구</option><option value="self_main">self_main · 우리 본진</option><option value="self_natural">self_natural · 우리 앞마당</option><option value="self_third">self_third · 우리 3멀티</option><option value="self_mineral_line">self_mineral_line · 우리 미네랄 라인</option><option value="enemy_mineral_line">enemy_mineral_line · 적 미네랄 라인</option><option value="scout_location">scout_location · 정찰 위치</option><option value="last_seen_enemy_area">last_seen_enemy_area · 마지막 적 위치</option></select><button>저장</button></div></form><p id="pin-feedback" role="status"></p><pre id="registry">registry를 불러오는 중…</pre></section></main><script src="./renderer.js"></script></body></html>
