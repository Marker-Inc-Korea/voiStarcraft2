<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>voiStarcraft2</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body data-dock="bottom" data-revealed="false" data-voice="off" data-settings="closed" data-motion="on">
  <div class="handle" id="handle" aria-hidden="true"></div>

  <section class="panel" id="panel">
    <canvas id="space" aria-hidden="true"></canvas>
    <div class="sheen" aria-hidden="true"></div>

    <div class="panel-body">
      <section class="deck" id="deck" aria-live="polite"><div class="cards" id="cards"></div></section>

      <section class="settings" id="settings" aria-label="설정">
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <div class="rows" id="rows"></div>
      </section>

      <footer class="bar" id="bar">
        <button class="orb" id="orb" type="button" aria-pressed="false" aria-label="음성">
          <span class="orb-halo" aria-hidden="true"></span>
          <span class="orb-core" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 15.5a3.5 3.5 0 0 0 3.5-3.5V6.5a3.5 3.5 0 1 0-7 0V12a3.5 3.5 0 0 0 3.5 3.5Z" fill="currentColor"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
        </button>
        <div class="bar-main">
          <p class="transcript" id="transcript" data-empty="true"></p>
          <form class="cmd-form" id="cmd-form" autocomplete="off">
            <input id="cmd-input" type="text" maxlength="2000" spellcheck="false" placeholder="명령" aria-label="명령">
          </form>
        </div>
        <button class="retreat" id="btn-retreat" type="button"><span id="retreat-word">후퇴</span></button>
        <button class="gear" id="btn-gear" type="button" aria-pressed="false" aria-label="설정" data-backend="unknown">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Zm8 4.1v-1.4l-1.9-.7a6.6 6.6 0 0 0-.6-1.4l.9-1.8-1-1-1.8.9c-.4-.3-.9-.5-1.4-.6l-.7-1.9h-1.4l-.7 1.9c-.5.1-1 .3-1.4.6l-1.8-.9-1 1 .9 1.8c-.3.4-.5.9-.6 1.4l-1.9.7v1.4l1.9.7c.1.5.3 1 .6 1.4l-.9 1.8 1 1 1.8-.9c.4.3.9.5 1.4.6l.7 1.9h1.4l.7-1.9c.5-.1 1-.3 1.4-.6l1.8.9 1-1-.9-1.8c.3-.4.5-.9.6-1.4l1.9-.7Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <i class="gear-dot" aria-hidden="true"></i>
        </button>
      </footer>
    </div>
  </section>

  <script src="./stages.js"></script>
  <script src="./settings.js"></script>
  <script src="./i18n.js"></script>
  <script src="./space.js"></script>
  <script src="./mic.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
