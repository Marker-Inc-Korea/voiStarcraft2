<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>voiStarcraft2 Commander</title><link rel="stylesheet" href="./style.css"></head><body><main><header><p class="eyebrow">voiStarcraft2 / DIRECT COMMAND</p><h1>전술 명령창</h1><span id="status">연결 확인 중…</span></header><section class="panel"><form id="command-form"><label for="command">명령</label><div class="row"><input id="command" autocomplete="off" placeholder="예: 앞마당을 방어해"><button>전송</button></div></form><p id="feedback" role="status"></p></section><section class="panel"><h2>최근 응답</h2><pre id="result">아직 명령이 없습니다.</pre></section><section class="panel"><h2>Clarification / lifecycle</h2><p id="lifecycle">이벤트를 기다리는 중…</p><pre id="events">아직 이벤트가 없습니다.</pre></section><section class="panel"><h2>Semantic target pin</h2><form id="pin-form"><div class="row"><input id="pin-name" required maxlength="120" placeholder="이름 (예: 앞마당 입구)"><input id="pin-target" required maxlength="120" placeholder="semantic target (예: enemy_natural)"><button>저장</button></div></form><p id="pin-feedback" role="status"></p><pre id="registry">registry를 불러오는 중…</pre></section></main><script src="./renderer.js"></script></body></html>
