<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>voiStarcraft2</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body data-dock="bottom" data-revealed="false" data-voice="off" data-settings="closed" data-motion="on" data-skin="cosmic">
  <div class="handle" id="handle" aria-hidden="true"></div>

  <!-- .hud = the positioned/sliding box; .panel = the clipped trapezoid glass; #outline = unclipped rim + glow of the same polygon -->
  <div class="hud" id="hud">
    <section class="panel" id="panel">
      <canvas id="space" aria-hidden="true"></canvas>
      <div class="sheen" aria-hidden="true"></div>
      <div class="sweep" aria-hidden="true"></div>
      <div class="term-fx" aria-hidden="true"></div>

      <div class="panel-body" id="panel-body">
        <section class="settings" id="settings" aria-label="설정">
          <nav class="tabs" id="tabs" role="tablist"></nav>
          <div class="rows" id="rows"></div>
        </section>

        <footer class="bar" id="bar">
          <button class="orb" id="orb" type="button" aria-pressed="false" aria-label="음성">
            <span class="orb-halo" aria-hidden="true"></span>
            <span class="orb-ring" aria-hidden="true"><i class="moon"></i></span>
            <span class="orb-core" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 15.5a3.5 3.5 0 0 0 3.5-3.5V6.5a3.5 3.5 0 1 0-7 0V12a3.5 3.5 0 0 0 3.5 3.5Z" fill="currentColor"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </span>
            <i class="led" aria-hidden="true"></i>
          </button>
          <div class="bar-main">
            <div class="line">
              <p class="transcript" id="transcript" data-empty="true"></p>
              <span class="ops" id="ops" hidden><i class="led" aria-hidden="true"></i><span id="ops-word">작전</span> <b id="ops-count">0</b></span>
            </div>
            <form class="cmd-form" id="cmd-form" autocomplete="off">
              <input id="cmd-input" type="text" maxlength="2000" spellcheck="false" placeholder="명령" aria-label="명령">
              <span class="term-ghost" id="term-ghost" aria-hidden="true"><span id="term-word">명령</span><i class="cursor"></i></span>
            </form>
          </div>
          <div class="emergency" id="emergency" role="group" aria-label="긴급">
            <button class="em" id="btn-retreat" type="button" data-action="retreat" data-state="idle" data-key="ok"><span class="em-word" id="retreat-word">후퇴</span><i class="em-sub"></i></button>
            <button class="em" id="btn-hold" type="button" data-action="hold" data-state="idle" data-key="ok"><span class="em-word" id="hold-word">홀드</span><i class="em-sub"></i></button>
            <button class="em" id="btn-stop" type="button" data-action="stop" data-state="idle" data-key="ok"><span class="em-word" id="stop-word">멈춰</span><i class="em-sub"></i></button>
          </div>
          <button class="gear" id="btn-gear" type="button" aria-pressed="false" aria-label="설정" data-backend="unknown">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Zm8 4.1v-1.4l-1.9-.7a6.6 6.6 0 0 0-.6-1.4l.9-1.8-1-1-1.8.9c-.4-.3-.9-.5-1.4-.6l-.7-1.9h-1.4l-.7 1.9c-.5.1-1 .3-1.4.6l-1.8-.9-1 1 .9 1.8c-.3.4-.5.9-.6 1.4l-1.9.7v1.4l1.9.7c.1.5.3 1 .6 1.4l-.9 1.8 1 1 1.8-.9c.4.3.9.5 1.4.6l.7 1.9h1.4l.7-1.9c.5-.1 1-.3 1.4-.6l1.8.9 1-1-.9-1.8c.3-.4.5-.9.6-1.4l1.9-.7Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <i class="gear-dot" aria-hidden="true"></i>
          </button>
        </footer>
      </div>
    </section>
    <svg class="outline" id="outline" aria-hidden="true">
      <defs>
        <linearGradient id="rim-grad" x1="0" y1="0" x2="1" y2="1"><stop class="rim-a" offset="0"/><stop class="rim-b" offset=".4"/><stop class="rim-c" offset=".75"/><stop class="rim-d" offset="1"/></linearGradient>
      </defs>
      <polygon id="outline-glow" class="outline-glow"/>
      <polygon id="outline-poly" class="outline-poly"/>
      <path id="outline-brackets" class="outline-brackets"/>
    </svg>
  </div>

  <script src="./stages.js"></script>
  <script src="./board_cards.js"></script>
  <script src="./settings.js"></script>
  <script src="./hud_shape.js"></script>
  <script src="./skins.js"></script>
  <script src="./sky.js"></script>
  <script src="./i18n.js"></script>
  <script src="./space.js"></script>
  <script src="./mic.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
