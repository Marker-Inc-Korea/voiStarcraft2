name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install package
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra llm
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q
      - name: Check soak scripts
        run: |
          bash -n integrations/micromachine/scripts/smoke_macos_local.sh
          bash -n integrations/micromachine/scripts/soak_macos_local.sh
          bash -n integrations/micromachine/scripts/soak_matrix_macos_local.sh

  micromachine-macos-contracts:
    if: github.event_name == 'push'
    needs:
      - unit-contracts
    runs-on: macos-14
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ROOT_DIR: /private/tmp/voi-micromachine-runtime
      BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Build exact MicroMachine integration
        run: integrations/micromachine/scripts/build_macos_local.sh
