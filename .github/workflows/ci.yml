name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install package
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra llm
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q
      - name: Check soak scripts
        run: |
          bash -n integrations/micromachine/scripts/smoke_macos_local.sh
          bash -n integrations/micromachine/scripts/soak_macos_local.sh
          bash -n integrations/micromachine/scripts/soak_matrix_macos_local.sh

  pre-live-build:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.id == github.event.repository.id
    needs:
      - unit-contracts
    name: pre-live-build
    runs-on: macos-14
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ROOT_DIR: /private/tmp/voi-micromachine-runtime
      BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build exact MicroMachine integration without credentials
        working-directory: candidate
        run: integrations/micromachine/scripts/build_macos_local.sh
      - name: Archive exact MicroMachine runtime
        run: |
          tar -czf "${RUNNER_TEMP}/pre-live-build-runtime.tar.gz" \
            -C "${ROOT_DIR}" MicroMachine s2client-api
      - name: Upload exact MicroMachine runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-live-build-runtime
          path: ${{ runner.temp }}/pre-live-build-runtime.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  pre-live-producer-isolation:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.id == github.event.repository.id
    needs:
      - unit-contracts
    name: pre-live-producer-isolation
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      VOI_PRODUCER_UID: "65001"
      VOI_PRODUCER_GID: "65001"
      VOI_TRUSTED_VERIFIER_COMMIT: c67bcafaecba3a4fdc47e664540e2956d37ab40b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: trusted-verifier
          persist-credentials: false
          ref: c67bcafaecba3a4fdc47e664540e2956d37ab40b
      - name: Verify immutable dedicated producer isolation
        working-directory: trusted-verifier
        run: |
          PYTHON_EXECUTABLE="$(python3 -c 'import os, sys; print(os.path.realpath(sys.executable))')"
          sudo env -u GITHUB_TOKEN -u GH_TOKEN \
            PYTHONDONTWRITEBYTECODE="1" \
            VOI_PRODUCER_UID="${VOI_PRODUCER_UID}" \
            VOI_PRODUCER_GID="${VOI_PRODUCER_GID}" \
            "${PYTHON_EXECUTABLE}" -B -m unittest \
              tests/test_micromachine_pre_live_provenance.py \
              -k dedicated_producer_uid

  pre-live-provenance:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.id == github.event.repository.id
    needs:
      - unit-contracts
      - pre-live-build
      - pre-live-producer-isolation
    name: pre-live-provenance
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ROOT_DIR: /private/tmp/voi-micromachine-runtime
      BUILD_JOBS: "3"
      VOI_PRODUCER_UID: "65001"
      VOI_PRODUCER_GID: "65001"
      VOI_CANDIDATE_WORKSPACE: ${{ github.workspace }}/candidate
      VOI_TRUSTED_VERIFIER_WORKSPACE: ${{ github.workspace }}/trusted-verifier
      VOI_TRUSTED_VERIFIER_COMMIT: c67bcafaecba3a4fdc47e664540e2956d37ab40b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: trusted-verifier
          persist-credentials: false
          ref: c67bcafaecba3a4fdc47e664540e2956d37ab40b
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download exact MicroMachine runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pre-live-build-runtime
          path: ${{ runner.temp }}/pre-live-build
      - name: Restore exact MicroMachine runtime
        run: |
          mkdir -p "${ROOT_DIR}"
          tar -xzf \
            "${RUNNER_TEMP}/pre-live-build/pre-live-build-runtime.tar.gz" \
            -C "${ROOT_DIR}"
      - name: Transfer verifier inputs to root ownership
        run: |
          sudo chown -RP 0:0 \
            "${VOI_CANDIDATE_WORKSPACE}" \
            "${VOI_TRUSTED_VERIFIER_WORKSPACE}" \
            "${ROOT_DIR}"
          sudo chmod 0755 \
            "${VOI_CANDIDATE_WORKSPACE}" \
            "${VOI_TRUSTED_VERIFIER_WORKSPACE}" \
            "${ROOT_DIR}"
      - name: Emit canonical authenticated provenance bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VOI_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/pre-live"
          PYTHON_EXECUTABLE="$(python3 -c 'import os, sys; print(os.path.realpath(sys.executable))')"
          VOI_NODE_EXECUTABLE="$(python3 -c 'import os, shutil; print(os.path.realpath(shutil.which("node") or ""))')"
          cd "${VOI_TRUSTED_VERIFIER_WORKSPACE}"
          printf '%s' "${GITHUB_TOKEN}" | sudo env -u GITHUB_TOKEN \
            GITHUB_API_URL="${GITHUB_API_URL}" \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            GITHUB_WORKFLOW_REF="${GITHUB_WORKFLOW_REF}" \
            GITHUB_WORKFLOW_SHA="${GITHUB_WORKFLOW_SHA}" \
            PYTHONDONTWRITEBYTECODE="1" \
            VOI_CANDIDATE_WORKSPACE="${VOI_CANDIDATE_WORKSPACE}" \
            VOI_NODE_EXECUTABLE="${VOI_NODE_EXECUTABLE}" \
            VOI_PRODUCER_GID="${VOI_PRODUCER_GID}" \
            VOI_PRODUCER_UID="${VOI_PRODUCER_UID}" \
            VOI_RELEASE_COMMIT="${VOI_RELEASE_COMMIT}" \
            VOI_TRUSTED_VERIFIER_COMMIT="${VOI_TRUSTED_VERIFIER_COMMIT}" \
            VOI_TRUSTED_VERIFIER_WORKSPACE="${VOI_TRUSTED_VERIFIER_WORKSPACE}" \
            "${PYTHON_EXECUTABLE}" -B -m starcraft_commander.micromachine_pre_live_provenance \
            --emit-github-actions-bundle \
            "${RUNNER_TEMP}/pre-live/pre-live-provenance.zip" \
            "${ROOT_DIR}/MicroMachine/build-latest-api/voi_build_identity.json" \
            "${ROOT_DIR}/MicroMachine/build-latest-api"
          sudo chown "$(id -u):$(id -g)" \
            "${RUNNER_TEMP}/pre-live/pre-live-provenance.zip"
      - name: Upload canonical authenticated provenance bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-live
          path: ${{ runner.temp }}/pre-live/pre-live-provenance.zip
          compression-level: 0
          if-no-files-found: error
      - name: Restore checkout ownership to the runner
        if: always()
        run: >-
          sudo chown -RP "$(id -u):$(id -g)"
          "${GITHUB_WORKSPACE}"

  micromachine-macos-contracts:
    if: github.event_name == 'push'
    needs:
      - unit-contracts
    runs-on: macos-14
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ROOT_DIR: /private/tmp/voi-micromachine-runtime
      BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Build exact MicroMachine integration
        run: integrations/micromachine/scripts/build_macos_local.sh
